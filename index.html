<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Off-the-Clock - Retirement Countdown</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #0f172a;
  min-height: 100vh;
  padding: 16px;
  padding-top: env(safe-area-inset-top, 16px);
  background-attachment: fixed;
  background-image: 
    radial-gradient(circle at 85% 12%, rgba(254, 240, 138, 0.95) 0%, rgba(253, 224, 71, 0.6) 12%, rgba(251, 146, 60, 0.3) 25%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(180deg, #38bdf8 0%, #7dd3fc 25%, #fdba74 48%, #0284c7 68%, #0284c7 82%, #fde047 88%, #fef08a 100%);
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center bottom;
}

.hidden { display: none !important; }
.setup, .app { max-width: 440px; margin: 0 auto; }

.setup h1 {
  text-align: center;
  font-size: 1.9em;
  font-weight: 800;
  margin-bottom: 4px;
  color: #0284c7;
  text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}

.setup .tagline {
  text-align: center;
  margin-bottom: 20px;
  font-size: 0.9em;
  color: #0369a1;
  font-weight: 600;
}

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.85em; font-weight: 700; margin-bottom: 6px; color: #0284c7; }
.form-group input, .form-group select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(2, 132, 199, 0.2);
  background: rgba(255, 255, 255, 0.92);
  color: #0f172a;
  font-size: 0.95em;
  outline: none;
}

.btn-start {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #0284c7, #0d9488);
  color: #ffffff;
  font-size: 1.1em;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
}
.btn-start:disabled { opacity: 0.4; cursor: not-allowed; }

.hero {
  text-align: center;
  padding: 24px 12px;
  background: linear-gradient(135deg, rgba(2, 132, 199, 0.92) 0%, rgba(3, 105, 161, 0.95) 100%);
  border-radius: 22px;
  margin-bottom: 16px;
  color: #ffffff;
  box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
}
.hero h1 { font-size: 1.6em; margin-bottom: 4px; color: #ffffff; font-weight: 800; }
.hero .retire-date { font-size: 0.9em; color: #e0f2fe; margin-bottom: 8px; }
.hero .live-timer { font-size: 1.6em; font-weight: 800; color: #fef08a; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.card {
  background: rgba(255, 255, 255, 0.88);
  border-radius: 18px;
  padding: 16px 10px;
  text-align: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.6);
}
.card .number { font-size: 1.8em; font-weight: 800; margin-bottom: 2px; }
.card .label { font-size: 0.7em; color: #64748b; text-transform: uppercase; font-weight: 700; }
.card.cal-stat .number { color: #f97316; }
.card.workdays .number { color: #0284c7; }
.card.holidays .number { color: #d97706; }
.card.vacation .number { color: #0d9488; }

.setup, .progress-section, .calendar-section, .upcoming, .fun-stats, .dreams-board, .finance-section {
  background: rgba(255, 255, 255, 0.88);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  border: 1px solid rgba(255, 255, 255, 0.7);
}

.progress-section h2, .calendar-section h2, .upcoming h2, .fun-stats h2, .dreams-board h2, .finance-section h2 {
  font-size: 0.9em;
  margin-bottom: 12px;
  color: #0284c7;
  text-transform: uppercase;
  font-weight: 800;
}

.progress-bar { height: 14px; background: rgba(226, 232, 240, 0.8); border-radius: 7px; overflow: hidden; margin-bottom: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #0d9488); transition: width 0.6s ease; }
.progress-text { font-size: 0.85em; color: #0284c7; text-align: right; font-weight: 800; }

.fun-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(226, 232, 240, 0.6); font-size: 0.85em; }
.fun-row:last-child { border: none; }
.fun-badge { font-size: 0.72em; font-weight: 800; padding: 2px 8px; border-radius: 12px; background: #e0f2fe; color: #0284c7; }
.fun-row .val { color: #0d9488; font-weight: 700; }

/* CALENDAR GRID STYLING */
.calendar-section { display: block; width: 100%; min-height: 280px; }
.cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cal-nav button { background: #e0f2fe; border: 1px solid #bae6fd; color: #0369a1; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1em; cursor: pointer; font-weight: 700; }
.cal-nav .month-label { font-size: 0.95em; font-weight: 700; color: #0f172a; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; }
.cal-grid .day-header { text-align: center; font-size: 0.65em; color: #64748b; padding: 4px 0; font-weight: 700; }
.cal-grid .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; border-radius: 8px; font-size: 0.75em; cursor: pointer; background: rgba(248, 250, 252, 0.9); border: 1px solid #f1f5f9; min-height: 48px; }
.day-cell.empty { visibility: hidden; }
.day-cell.weekend { background: #fff7ed; }
.day-cell.today { border: 2px solid #0284c7; font-weight: bold; background: #e0f2fe; }
.day-cell.checked { background: #dcfce7 !important; border-color: #86efac !important; }
.day-cell .d-num { font-weight: 700; color: #0f172a; }

.upcoming-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(226, 232, 240, 0.6); font-size: 0.85em; }
.upcoming-item:last-child { border: none; }

.dreams-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.dreams-picker .dream-tag { padding: 8px 12px; border-radius: 20px; background: #e0f2fe; border: 1px solid #bae6fd; font-size: 0.82em; cursor: pointer; color: #0369a1; }
.dreams-picker .dream-tag.selected { background: #0284c7; border-color: #0284c7; color: #ffffff; font-weight: 600; }

.btn-fresh { background: #0f172a; color: #ffffff; border: none; padding: 12px 24px; border-radius: 12px; font-size: 0.9em; font-weight: 700; cursor: pointer; }

.float-emoji {
  position: fixed;
  pointer-events: none;
  font-size: 2.2em;
  z-index: 10000;
  animation: float-up 1.2s ease-out forwards;
}
@keyframes float-up {
  0% { opacity: 1; transform: translateY(0) scale(0.8); }
  50% { opacity: 1; transform: translateY(-40px) scale(1.3); }
  100% { opacity: 0; transform: translateY(-80px) scale(1); }
}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div class="setup" id="setupScreen">
  <h1>Off-the-Clock</h1>
  <p class="tagline">Count down to the rest of your life</p>

  <div class="form-group">
    <label>Your Birthday</label>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <select id="inputBirthMonth"><option value="">Month</option></select>
      <select id="inputBirthDay"><option value="">Day</option></select>
      <select id="inputBirthYear"><option value="">Year</option></select>
    </div>
  </div>
  <div class="form-group">
    <label>Country</label>
    <select id="inputCountry">
      <option value="">Select your country...</option>
      <option value="US">United States</option>
      <option value="UK">United Kingdom</option>
      <option value="CA">Canada</option>
      <option value="IL">Israel</option>
    </select>
  </div>
  <div class="form-group">
    <label>Annual Vacation Days</label>
    <input type="number" id="inputVacation" min="0" max="60" placeholder="e.g. 20">
  </div>

  <button class="btn-start" id="btnStart" disabled>Start My Countdown</button>
</div>

<!-- MAIN APP SCREEN -->
<div class="app hidden" id="appScreen">
  <header class="hero">
    <h1>Counting Down to Freedom</h1>
    <div class="retire-date" id="heroDate"></div>
    <div class="live-timer" id="clockDisplay">00d 00h 00m 00s</div>
  </header>

  <!-- ONLY CALENDAR GRID IN THE APP -->
  <main class="calendar-section">
    <h2>Calendar Overview</h2>
    <div class="cal-nav">
      <button id="prevMonth">&lt;</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth">&gt;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </main>

  <div class="cards">
    <div class="card cal-stat"><div class="number" id="calDays">--</div><div class="label">Calendar Days</div></div>
    <div class="card workdays"><div class="number" id="workDays">--</div><div class="label">Work Days</div></div>
    <div class="card holidays"><div class="number" id="holDays">--</div><div class="label">Holidays Left</div></div>
    <div class="card vacation"><div class="number" id="vacDays">--</div><div class="label">Vacation Days</div></div>
  </div>

  <div class="progress-section">
    <h2>Career Progress</h2>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0% Complete</div>
  </div>

  <div class="fun-stats">
    <h2>Freedom Milestones</h2>
    <div id="funList"></div>
  </div>

  <div style="text-align:center;margin-top:20px;padding-bottom:20px">
    <button id="btnReset" class="btn-fresh">🔄 Start Fresh / Clear Data</button>
  </div>
</div>

<script>
function floatEmoji(x, y) {
  const emojis = ['🎉','🥳','🙌','✨','💪','🎊','🏖️','⭐','🚀','🌴','🍹'];
  const el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  el.style.left = (x - 15) + 'px'; 
  el.style.top = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

const setupScreen = document.getElementById('setupScreen');
const appScreen = document.getElementById('appScreen');
const inputCountry = document.getElementById('inputCountry');
const inputBirthMonth = document.getElementById('inputBirthMonth');
const inputBirthDay = document.getElementById('inputBirthDay');
const inputBirthYear = document.getElementById('inputBirthYear');
const btnStart = document.getElementById('btnStart');

(function initSetup(){
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  months.forEach((m,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=m;inputBirthMonth.appendChild(o)});
  for(let d=1;d<=31;d++){const o=document.createElement('option');o.value=d;o.textContent=d;inputBirthDay.appendChild(o)}
  const curYear=new Date().getFullYear();
  for(let y=curYear-16;y>=curYear-80;y--){const o=document.createElement('option');o.value=y;o.textContent=y;inputBirthYear.appendChild(o)}
})();

function getBirthdayValue(){
  const m=inputBirthMonth.value,d=inputBirthDay.value,y=inputBirthYear.value;
  if(!m||!d||!y)return'';
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function checkReady() { 
  btnStart.disabled = !(getBirthdayValue() && inputCountry.value); 
}
inputCountry.addEventListener('change', checkReady);
inputBirthMonth.addEventListener('change', checkReady);
inputBirthDay.addEventListener('change', checkReady);
inputBirthYear.addEventListener('change', checkReady);

btnStart.addEventListener('click', () => {
  const bDayVal = getBirthdayValue();
  const bParts = bDayVal.split('-');
  const birthYear = parseInt(bParts[0], 10);
  const birthMonth = parseInt(bParts[1], 10) - 1;
  const birthDay = parseInt(bParts[2], 10);
  
  const calcRetireDate = new Date(birthYear + 65, birthMonth, birthDay);

  const config = {
    birthday: bDayVal,
    retireDate: calcRetireDate.toISOString().slice(0,10),
    vacDays: parseInt(document.getElementById('inputVacation').value, 10) || 20
  };
  localStorage.setItem('freedomclock_config', JSON.stringify(config));
  location.reload();
});

let timerInterval = null;

function startApp(config) {
  setupScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');

  const RETIREMENT_DATE = new Date(config.retireDate);
  RETIREMENT_DATE.setHours(17, 0, 0, 0);

  if (timerInterval) clearInterval(timerInterval);
  function updateLiveClock() {
    const now = new Date();
    const diff = RETIREMENT_DATE - now;
    const clockEl = document.getElementById('clockDisplay');

    if (diff <= 0) {
      clockEl.textContent = "00d 00h 00m 00s — Freedom!";
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    clockEl.textContent = `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
  }
  timerInterval = setInterval(updateLiveClock, 1000);
  updateLiveClock();

  const today = new Date(); today.setHours(0,0,0,0);
  const calDaysLeft = Math.max(0, Math.floor((RETIREMENT_DATE - today)/86400000));

  document.getElementById('heroDate').textContent = RETIREMENT_DATE.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  document.getElementById('calDays').textContent = calDaysLeft.toLocaleString();
  document.getElementById('workDays').textContent = Math.round(calDaysLeft * 5 / 7).toLocaleString();
  document.getElementById('holDays').textContent = "10";
  document.getElementById('vacDays').textContent = Math.round((calDaysLeft / 365) * config.vacDays);

  let viewYear = today.getFullYear(), viewMonth = today.getMonth();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function getChecks(){ try{ return JSON.parse(localStorage.getItem('fc_checks')||'{}'); }catch(e){ return {}; } }
  function saveChecks(c){ localStorage.setItem('fc_checks', JSON.stringify(c)); }

  function renderCal(){
    document.getElementById('monthLabel').textContent = monthNames[viewMonth] + ' ' + viewYear;
    const grid = document.getElementById('calGrid');
    if (!grid) return;
    grid.innerHTML = '';
    
    ['S','M','T','W','T','F','S'].forEach(d => { 
      const el = document.createElement('div'); 
      el.className = 'day-header'; 
      el.textContent = d; 
      grid.appendChild(el); 
    });
    
    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const dim = new Date(viewYear, viewMonth + 1, 0).getDate();
    const checks = getChecks();

    for(let i = 0; i < firstDow; i++){ 
      const el = document.createElement('div'); 
      el.className = 'day-cell empty'; 
      grid.appendChild(el); 
    }
    
    for(let d = 1; d <= dim; d++){
      const cellDate = new Date(viewYear, viewMonth, d);
      const key = viewYear + '-' + String(viewMonth + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const el = document.createElement('div');
      el.className = 'day-cell';
      if (cellDate.getDay() === 0 || cellDate.getDay() === 6) el.classList.add('weekend');
      if (cellDate.getTime() === today.getTime()) el.classList.add('today');
      if (checks[key]) el.classList.add('checked');

      // Plain number rendering with no emojis
      el.innerHTML = '<div class="d-num">' + d + '</div>';
      
      el.addEventListener('click', (evt) => {
        const ch = getChecks();
        if (ch[key]){
          delete ch[key];
          el.classList.remove('checked');
        } else {
          ch[key] = true;
          el.classList.add('checked');
          floatEmoji(evt.clientX, evt.clientY);
        }
        saveChecks(ch);
      });

      grid.appendChild(el);
    }
  }

  document.getElementById('prevMonth').onclick = () => { viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } renderCal(); };
  document.getElementById('nextMonth').onclick = () => { viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } renderCal(); };
  renderCal();
}

document.getElementById('btnReset').addEventListener('click', () => {
  localStorage.clear();
  location.reload();
});

const saved = localStorage.getItem('freedomclock_config');
if (saved) { startApp(JSON.parse(saved)); } else { setupScreen.classList.remove('hidden'); }
</script>
</body>
</html>
